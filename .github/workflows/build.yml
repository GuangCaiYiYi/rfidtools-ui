name: build-apk

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # AGP 7.1.2 + Gradle 7.2 只支持到 JDK 11，所以整体固定在 JDK 11，
      # 命令行工具也选兼容 JDK 11 的 9.0 版本（新版 sdkmanager 需要 JDK 17）。
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sS -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-29" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;21.4.7075529" \
            "cmake;3.22.1" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk ok"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :apprts:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find apprts/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: rfidtools-ui-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          prerelease: true
          files: out/*.apk
          body: |
            自动构建，基于 UI 现代化改造版本。
            安装前请先卸载旧版（包名相同但签名不同）。
